<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Ціль поруч</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none;
      font: 14px/1.35 "Segoe UI", system-ui, sans-serif; color: #fff; }
    body { padding: 10px; }
    /* Shown for 2 s, semi-transparent and click-through, so it never gets in the way. */
    #bar { display: none; width: max-content; min-width: 260px; max-width: 440px; box-sizing: border-box;
      padding: 9px 14px; border-radius: 12px; position: relative;
      background: linear-gradient(135deg, rgba(224, 98, 14, .6), rgba(138, 51, 5, .6)); border: 1px solid rgba(255, 176, 98, .7);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .25); text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
      animation: drop .3s ease-out; transition: opacity .4s; }
    #bar.out { opacity: 0; }
    #title { font-size: 14px; font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 7px; }
    #list { margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
    .row { display: flex; align-items: center; gap: 7px; font-size: 13px; }
    .row svg { width: 17px; height: 17px; flex: none; fill: #fff; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .6)); }
    .row svg .s { fill: none; stroke: #fff; }
    .row .tr { color: #ffe08a; font-weight: 600; }
    .more { font-size: 12px; opacity: .85; padding-left: 24px; }
    @keyframes drop { from { transform: translateY(-16px); opacity: 0; } }
  </style>
</head>
<body>
  <div id="bar">
    <div id="title"><span>⚠</span><span class="text"></span></div>
    <div id="list"></div>
  </div>
  <script src="types.js"></script>
  <script src="alert.js"></script>
</body>
</html>
