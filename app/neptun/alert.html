<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Ціль поруч</title>
  <link rel="stylesheet" href="hud.css">
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
    body { padding: 10px; }
    /* Shown for 2 s, semi-transparent and click-through, so it never gets in the way. */
    #bar {
      --h-glass: rgba(9, 15, 24, 0.62);
      --hc: var(--h-orange);
      display: none;
      width: max-content;
      min-width: 270px;
      max-width: 400px;
      box-shadow: inset 0 3px 0 var(--hc), 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 26px color-mix(in srgb, var(--hc) 30%, transparent);
      animation: drop 0.3s ease-out;
      transition: opacity 0.4s;
    }
    #bar.r2 { --hc: var(--h-red); }
    #bar.out { opacity: 0; }
    #bar .h-head { background: linear-gradient(90deg, color-mix(in srgb, var(--hc) 30%, transparent), transparent 80%); }
    #bar .h-head .h-ico { color: var(--hc); width: 15px; height: 15px; }
    #bar .h-title { font-size: 13px; letter-spacing: 0.06em; color: #fff; text-shadow: 0 0 10px color-mix(in srgb, var(--hc) 70%, transparent); }
    .h-ent { cursor: default; }
    .h-ent:hover { transform: none; background: transparent; }
    @keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #bar { animation: none; } }
  </style>
</head>
<body>
  <div id="bar" class="h-pan">
    <div class="h-head"><svg class="h-ico" viewBox="-8 -8 16 16"><path d="M0-7.2 7.4 6.2H-7.4Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M-.8-2.4H.8L.5 2.2H-.5ZM-.9 3.4H.9V5H-.9Z"/></svg><span class="h-title"></span></div>
    <div class="h-list" id="list"></div>
  </div>
  <script src="types.js"></script>
  <script src="alert.js"></script>
</body>
</html>
