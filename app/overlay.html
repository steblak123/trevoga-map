<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Тривога</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none;
      font: 15px/1.35 "Segoe UI", system-ui, sans-serif; color: #fff; }
    body { padding: 14px; }
    /* Shown for 2 s, semi-transparent and click-through, so it never gets in the way. */
    #bar { display: none; width: max-content; min-width: 360px; max-width: 660px;
      box-sizing: border-box; padding: 12px 18px; border-radius: 14px; position: relative;
      box-shadow: 0 6px 20px rgba(0,0,0,.25); animation: drop .35s ease-out;
      text-shadow: 0 1px 3px rgba(0,0,0,.6); transition: opacity .4s; }
    #bar.out { opacity: 0; }
    #bar.alert { background: linear-gradient(135deg, rgba(198,40,40,.62), rgba(142,27,27,.62)); border: 1px solid rgba(255,107,107,.7); }
    #bar.alert::before { content: ""; position: absolute; inset: 0; border-radius: inherit;
      box-shadow: 0 0 0 0 rgba(255, 80, 80, .7); animation: ring 1.6s infinite; pointer-events: none; }
    #bar.clear { background: linear-gradient(135deg, rgba(46,125,50,.62), rgba(27,94,32,.62)); border: 1px solid rgba(129,199,132,.7); }
    #title { font-size: 19px; font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 10px; }
    #title .icon { font-size: 22px; }
    #list { margin-top: 4px; font-size: 14px; opacity: .95; }
    #list div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #hint { margin-top: 4px; font-size: 12px; opacity: .8; }
    @keyframes drop { from { transform: translateY(-30px); opacity: 0; } }
    @keyframes ring { 70% { box-shadow: 0 0 0 12px rgba(255, 80, 80, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 80, 80, 0); } }
  </style>
</head>
<body>
  <div id="bar">
    <div id="title"><span class="icon"></span><span class="text"></span></div>
    <div id="list"></div>
    <div id="hint"></div>
  </div>
  <script src="regions.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
