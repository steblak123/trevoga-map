<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Тривога</title>
  <link rel="stylesheet" href="neptun/hud.css">
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; color: #fff; }
    body { padding: 14px; }
    /* Shown for 5 s, semi-transparent and click-through, so it never gets in the way. */
    #bar {
      --h-glass: rgba(9, 15, 24, 0.6);
      --hc: var(--h-red);
      display: none;
      width: max-content;
      min-width: 340px;
      max-width: 620px;
      box-shadow: inset 0 3px 0 var(--hc), 0 8px 26px rgba(0, 0, 0, 0.35), 0 0 30px color-mix(in srgb, var(--hc) 32%, transparent);
      animation: drop 0.35s ease-out;
      transition: opacity 0.4s;
    }
    #bar.out { opacity: 0; }
    #bar.clear { --hc: var(--h-green); }
    #bar.alert::before { content: ""; position: absolute; inset: 0; border-radius: inherit;
      box-shadow: 0 0 0 0 rgba(255, 77, 87, 0.7); animation: ring 1.6s infinite; pointer-events: none; }
    #bar .h-head { padding: 8px 14px 7px; background: linear-gradient(90deg, color-mix(in srgb, var(--hc) 34%, transparent), transparent 85%); }
    #bar .h-head .h-ico { width: 18px; height: 18px; color: var(--hc); }
    #bar .h-title { font-size: 16px; letter-spacing: 0.06em; color: #fff; text-shadow: 0 0 12px color-mix(in srgb, var(--hc) 70%, transparent); }
    #list { display: flex; flex-direction: column; padding: 2px 0; }
    .ov-row { display: flex; flex-wrap: wrap; gap: 4px; padding: 5px 14px 5px 11px; border-left: 3px solid var(--hc); }
    .ov-row + .ov-row { border-top: 1px dashed var(--h-line); }
    .ov-row .h-b { height: 19px; font-size: 11.5px; }
    .ov-row .h-b.place { --bc: #e6edf5; font-weight: 700; }
    .ov-row .h-b.part { --bc: var(--h-orange); }
    #hint { display: flex; padding: 3px 14px 8px; }
    #hint .h-b { --bc: var(--hc); height: 19px; font-size: 11px; }
    /* "Акуратний" look (settings): no glow, no pulse, quieter colours. */
    #bar.calm { box-shadow: inset 0 2px 0 color-mix(in srgb, var(--hc) 70%, #9aa7b8), 0 6px 18px rgba(0, 0, 0, 0.3); --h-glass: rgba(14, 19, 27, 0.8); }
    #bar.calm::before { display: none; }
    #bar.calm .h-head { background: none; }
    #bar.calm .h-title { text-shadow: none; font-weight: 600; letter-spacing: 0.03em; }
    #bar.calm .h-head .h-ico { color: color-mix(in srgb, var(--hc) 70%, #c9d3de); }
    #bar.calm .h-b { box-shadow: none; text-shadow: none; }
    #bar.calm .ov-row { border-left-color: color-mix(in srgb, var(--hc) 55%, transparent); }
    @keyframes drop { from { transform: translateY(-30px); opacity: 0; } }
    @keyframes ring { 70% { box-shadow: 0 0 0 12px rgba(255, 77, 87, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 77, 87, 0); } }
    @media (prefers-reduced-motion: reduce) { #bar, #bar.alert::before { animation: none; } }
  </style>
</head>
<body>
  <div id="bar" class="h-pan">
    <div id="title" class="h-head"><span class="icon"></span><span class="text h-title"></span></div>
    <div id="list"></div>
    <div id="hint"></div>
  </div>
  <script src="regions.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
