<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Тривога</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none;
      font: 15px/1.35 "Segoe UI", system-ui, sans-serif; color: #fff; }
    #bar { display: none; margin: 0 auto; width: fit-content; min-width: 360px; max-width: 660px;
      box-sizing: border-box; padding: 12px 44px 12px 18px; border-radius: 14px; position: relative;
      box-shadow: 0 8px 28px rgba(0,0,0,.45); animation: drop .35s ease-out; }
    #bar.alert { background: linear-gradient(135deg, #c62828, #8e1b1b); border: 1px solid #ff6b6b; }
    #bar.alert::before { content: ""; position: absolute; inset: 0; border-radius: inherit;
      box-shadow: 0 0 0 0 rgba(255, 80, 80, .7); animation: ring 1.6s infinite; pointer-events: none; }
    #bar.clear { background: linear-gradient(135deg, #2e7d32, #1b5e20); border: 1px solid #81c784; }
    #title { font-size: 19px; font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 10px; }
    #title .icon { font-size: 22px; }
    #list { margin-top: 4px; font-size: 14px; opacity: .95; }
    #list div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #hint { margin-top: 4px; font-size: 12px; opacity: .8; }
    #close { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border: 0; border-radius: 8px;
      background: rgba(0,0,0,.25); color: #fff; font-size: 16px; cursor: pointer; }
    #close:hover { background: rgba(0,0,0,.45); }
    @keyframes drop { from { transform: translateY(-30px); opacity: 0; } }
    @keyframes ring { 70% { box-shadow: 0 0 0 12px rgba(255, 80, 80, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 80, 80, 0); } }
  </style>
</head>
<body>
  <div id="bar">
    <div id="title"><span class="icon"></span><span class="text"></span></div>
    <div id="list"></div>
    <div id="hint"></div>
    <button id="close" title="Закрити">✕</button>
  </div>
  <script src="regions.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
